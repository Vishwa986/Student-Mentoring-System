<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Mentoring & Counseling Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #123c69;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        button {
            background: #123c69;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0d2d50;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Student Mentoring & Counseling Management System</h1>
        <p>Mentor • Monitor • Support • Improve</p>
    </div>

    <div class="container">

        <div class="card">

            <h2>Welcome</h2>

            <p>
                A centralized platform for academic monitoring,
                attendance, counseling and intervention.
            </p>

            <button onclick="checkBackend()">
                Check Backend
            </button>

            <div id="message"></div>

        </div>

    </div>

    <script>

        async function checkBackend() {

            const message = document.getElementById("message");

            try {

                const response = await fetch(
                    "http://localhost:8080/api/test"
                );

                const data = await response.text();

                message.innerText = data;

            } catch (error) {

                message.innerText =
                    "Backend is not running yet.";

            }

        }

    </script>

</body>
</html>
